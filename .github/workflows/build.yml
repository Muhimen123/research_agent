name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Always runs first — creates a release for tags, no-op for branches
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - name: Check if this is a tag push
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (tags only)
        if: ${{ steps.check.outputs.is_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only create the release if it doesn't already exist.
          # This avoids swallowing real errors (e.g. permission failures)
          # behind a blind `|| true`.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping creation."
          else
            gh release create "${{ github.ref_name }}" \
              --title "PaperSummarizer ${{ github.ref_name }}" \
              --generate-notes \
              --draft
          fi

  build:
    needs: [prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            exe_name: PaperSummarizer.exe
          - os: macos-latest
            exe_name: PaperSummarizer
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name "PaperSummarizer" main.py

      - name: Upload to release (tagged only)
        if: ${{ needs.prepare.outputs.is_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "dist/${{ matrix.exe_name }}" --clobber

      - name: Upload artifact (non-release)
        if: ${{ needs.prepare.outputs.is_tag != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PaperSummarizer-${{ matrix.os }}
          path: dist/${{ matrix.exe_name }}