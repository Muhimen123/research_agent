name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]  # Also build on version tags like v1.0, v1.1, etc.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: PaperSummarizer-Windows
            exe_name: PaperSummarizer.exe
          - os: macos-latest
            artifact_name: PaperSummarizer-macOS
            exe_name: PaperSummarizer
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name "PaperSummarizer" main.py

      - name: Upload artifact (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.exe_name }}

      - name: Upload to release (tagged only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/${{ matrix.exe_name }} --clobber

  # Create the release only once (not per-OS)
  create-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "PaperSummarizer ${{ github.ref_name }}" \
            --generate-notes \
            --draft || true  # Ignore error if release already exists